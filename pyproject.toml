[project]
name = "aqi-daemon"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
    "schedule>=1.2.2",
    "sds011lib>=0.5.0",
]

[project.scripts]
aqidaemon = "aqi_daemon.main:start"

[build-system]
requires = ["uv_build>=0.13.10,<0.14"]
build-backend = "uv_build"